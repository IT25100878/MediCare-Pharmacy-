<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edit Supplier | MediCare Pharmacy</title><link rel="stylesheet" th:href="@{/css/module.css}" href="/css/module.css"></head>
<body class="module-page procurement"><div th:replace="~{fragments/module-header :: header}"></div>
<main class="edit-main"><a class="back-link" th:href="@{/procurement/suppliers}">← Back to suppliers</a><section class="edit-card"><p class="role-label">Procurement Coordinator · Update</p><h1>Edit supplier</h1>
<form th:action="@{/procurement/suppliers/{supplierId}/edit(supplierId=${supplier.supplierId})}" th:object="${supplier}" method="post" class="record-form" novalidate><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="form-grid"><label>Supplier name<input type="text" th:field="*{supplierName}" maxlength="150" required><small th:errors="*{supplierName}"></small></label><label>Contact person<input type="text" th:field="*{contactPerson}" maxlength="120"><small th:errors="*{contactPerson}"></small></label><label>Contact number<input type="text" th:field="*{contactNumber}" maxlength="30" required><small th:errors="*{contactNumber}"></small></label><label>Email<input type="email" th:field="*{email}" maxlength="150"><small th:errors="*{email}"></small></label><label>Business registration ID<input type="text" th:field="*{businessRegistrationId}" maxlength="80"><small th:errors="*{businessRegistrationId}"></small></label><label>Medicine category<input type="text" th:field="*{medicineCategory}" maxlength="100"><small th:errors="*{medicineCategory}"></small></label><label class="full-width">Payment terms<input type="text" th:field="*{paymentTerms}" maxlength="150"><small th:errors="*{paymentTerms}"></small></label><label class="full-width">Address<textarea th:field="*{address}" maxlength="300" rows="3"></textarea><small th:errors="*{address}"></small></label><label class="checkbox-label"><input type="checkbox" th:field="*{active}"> Active supplier</label></div>
<div class="form-actions"><button class="primary-button" type="submit">Save changes</button><a th:href="@{/procurement/suppliers}">Cancel</a></div></form></section></main></body></html>
