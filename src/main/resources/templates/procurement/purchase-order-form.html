<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edit Purchase Order | MediCare Pharmacy</title><link rel="stylesheet" th:href="@{/css/module.css}" href="/css/module.css"></head>
<body class="module-page procurement"><div th:replace="~{fragments/module-header :: header}"></div><main class="edit-main"><a class="back-link" th:href="@{/procurement/purchase-orders}">← Back to purchase orders</a><section class="edit-card"><p class="role-label">Procurement Coordinator · Update</p><h1>Edit purchase order</h1>
<form th:action="@{/procurement/purchase-orders/{purchaseOrderId}/edit(purchaseOrderId=${purchaseOrder.purchaseOrderId})}" th:object="${purchaseOrder}" method="post" class="record-form" novalidate><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="form-grid"><label>Purchase order number<input type="text" th:field="*{purchaseOrderNumber}" maxlength="30" required><small th:errors="*{purchaseOrderNumber}"></small></label><label>Supplier<select th:field="*{supplierId}" required><option value="">Choose supplier</option><option th:each="supplier : ${suppliers}" th:value="${supplier.supplierId}" th:text="${supplier.supplierName}">Supplier</option></select><small th:errors="*{supplierId}"></small></label><label>Order date<input type="date" th:field="*{orderDate}" required><small th:errors="*{orderDate}"></small></label><label>Expected date<input type="date" th:field="*{expectedDate}"><small th:errors="*{expectedDate}"></small></label><label>Total amount (LKR)<input type="number" th:field="*{totalAmount}" min="0" step="0.01" required><small th:errors="*{totalAmount}"></small></label><label>Status<select th:field="*{purchaseOrderStatus}"><option value="PENDING">Pending</option><option value="ORDERED">Ordered</option><option value="RECEIVED">Received</option><option value="CANCELLED">Cancelled</option></select><small th:errors="*{purchaseOrderStatus}"></small></label></div>
<div class="form-actions"><button class="primary-button" type="submit">Save changes</button><a th:href="@{/procurement/purchase-orders}">Cancel</a></div></form></section></main></body></html>
