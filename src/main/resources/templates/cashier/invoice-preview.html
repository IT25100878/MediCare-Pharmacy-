<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Invoice | MediCare Pharmacy</title><link rel="stylesheet" th:href="@{/css/module.css}"><style>
.invoice-sheet{max-width:920px;margin:0 auto;padding:44px;border:1px solid #d8e9ee;border-radius:24px;background:#fff;box-shadow:0 22px 58px rgba(16,42,67,.12)}.invoice-top{display:flex;justify-content:space-between;gap:24px;padding-bottom:24px;border-bottom:1px solid #dcebf0}.invoice-brand{display:flex;align-items:center;gap:12px}.invoice-brand img{width:72px;height:54px;object-fit:contain}.invoice-brand h1{margin:0;color:#102a43;font-size:1.9rem}.invoice-meta{text-align:right;color:#5b7281}.invoice-meta strong{display:block;color:#0f8b8d;font-size:1.05rem}.invoice-party{display:flex;justify-content:space-between;gap:24px;padding:26px 0;color:#486273}.invoice-party h2{margin:0 0 7px;color:#102a43;font-size:1rem}.invoice-sheet table{min-width:0}.invoice-totals{margin-left:auto;width:min(100%,340px);padding-top:20px}.invoice-totals div{display:flex;justify-content:space-between;gap:18px;padding:8px 0;color:#58717e}.invoice-totals .net{border-top:2px solid #0f8b8d;color:#102a43;font-size:1.12rem;font-weight:900}.invoice-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.invoice-actions form{margin:0}.secondary-button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 14px;border:1px solid #bdd7df;border-radius:10px;background:white;color:#1d5564;font-weight:800;cursor:pointer}.void-button{border-color:#f0c6c6;color:#b33b3b}.invoice-note{margin:25px 0 0;color:#6d838e;font-size:.8rem;line-height:1.5}@media print{.module-header,.invoice-actions,.back-link{display:none!important}.edit-main{padding:0}.invoice-sheet{border:0;box-shadow:none;border-radius:0}}@media(max-width:640px){.invoice-sheet{padding:23px}.invoice-top,.invoice-party{flex-direction:column}.invoice-meta{text-align:left}}
</style></head>
<body class="module-page cashier"><div th:replace="~{fragments/module-header :: header}"></div>
<main class="edit-main"><a class="back-link" th:href="@{/cashier/invoices}">← Back to invoices</a>
    <section class="invoice-sheet"><div class="invoice-top"><div class="invoice-brand"><img th:src="@{/images/medicare-for-all-logo.webp}" alt="MediCare for All logo"><div><p class="role-label">MediCare Pharmacy</p><h1>Sales invoice</h1></div></div><div class="invoice-meta"><strong th:text="${details.invoice.invoiceNumber}">INV</strong><span th:text="${details.invoice.generatedAt == null ? '—' : #temporals.format(details.invoice.generatedAt, 'dd MMM yyyy HH:mm')}">Date</span><span th:text="${details.invoice.invoiceStatus}">ISSUED</span></div></div>
        <div class="invoice-party"><div><h2>Billed to</h2><strong th:text="${details.order.customerName}">Customer</strong><p th:text="${details.order.customerPhone}">Phone</p></div><div><h2>Checkout reference</h2><strong th:text="${details.order.orderNumber}">ORD</strong><p th:text="${details.order.paymentMethod + ' · ' + details.order.paymentStatus}">Payment</p></div></div>
        <div class="table-scroll"><table><thead><tr><th>Medicine</th><th>Batch</th><th>Qty</th><th>Unit price</th><th>Line total</th></tr></thead><tbody><tr th:each="line : ${details.lines}"><td><strong th:text="${line.medicineName}">Medicine</strong></td><td th:text="${line.batchNumber}">Batch</td><td th:text="${line.quantity}">1</td><td th:text="${'LKR ' + #numbers.formatDecimal(line.unitPrice,1,'COMMA',2,'POINT')}">LKR</td><td th:text="${'LKR ' + #numbers.formatDecimal(line.lineTotal,1,'COMMA',2,'POINT')}">LKR</td></tr></tbody></table></div>
        <div class="invoice-totals"><div><span>Gross total</span><b th:text="${'LKR ' + #numbers.formatDecimal(details.order.totalAmount,1,'COMMA',2,'POINT')}">LKR</b></div><div><span>Promotion discount</span><b th:text="${'− LKR ' + #numbers.formatDecimal(details.order.discountAmount,1,'COMMA',2,'POINT')}">LKR</b></div><div class="net"><span>Amount paid</span><b th:text="${'LKR ' + #numbers.formatDecimal(details.netAmount,1,'COMMA',2,'POINT')}">LKR</b></div></div>
        <div class="invoice-actions"><form th:if="${details.invoice.invoiceStatus == 'ISSUED'}" th:action="@{/cashier/invoices/{invoiceId}/print(invoiceId=${details.invoice.invoiceId})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="primary-button" type="submit">Print invoice</button></form><a class="secondary-button" th:href="@{/cashier/invoices}">Invoice history</a><form th:if="${details.invoice.invoiceStatus == 'ISSUED'}" th:action="@{/cashier/invoices/{invoiceId}/void(invoiceId=${details.invoice.invoiceId})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="note" value="Voided from invoice centre."><button class="secondary-button void-button" type="submit" data-confirm="Void this invoice? The document will remain in the audit trail.">Void invoice</button></form></div>
        <p class="invoice-note" th:text="${details.invoice.notes}">Invoice note</p>
    </section>
</main>
<script th:if="${autoPrint}">window.addEventListener('load', () => window.print());</script>
</body></html>
