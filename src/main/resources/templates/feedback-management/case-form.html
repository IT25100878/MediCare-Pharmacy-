<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Resolve Feedback Case | MediCare Pharmacy</title><link rel="stylesheet" th:href="@{/css/module.css}"></head>
<body class="module-page feedback-manager"><div th:replace="~{fragments/module-header :: header}"></div>
<main class="edit-main"><a class="back-link" th:href="@{/feedback-management/cases}">← Back to feedback cases</a><section class="edit-card"><p class="role-label">Customer Feedback Manager · Case update</p><h1>Manage feedback case</h1>
<div class="submitted-feedback"><p><strong>Customer:</strong> <span th:text="${feedback.customerName ?: 'Anonymous customer'}">Customer</span></p><p><strong>Contact:</strong> <span th:text="${feedback.customerPhone ?: 'Not provided'}">Phone</span></p><p><strong>Submitted:</strong> <span th:text="${feedback.createdAt == null ? '—' : #temporals.format(feedback.createdAt,'dd MMM yyyy HH:mm')}">Date</span></p><p><strong>Subject:</strong> <span th:text="${feedback.subject}">Subject</span></p><p><strong>Message:</strong></p><blockquote th:text="${feedback.message}">Message</blockquote></div>
<form th:action="@{/feedback-management/cases/{feedbackId}/edit(feedbackId=${feedback.feedbackId})}" th:object="${caseForm}" method="post" class="record-form" novalidate><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<p class="form-error" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
<div class="form-grid"><label>Case status<select th:field="*{feedbackStatus}"><option value="NEW">New</option><option value="IN_PROGRESS">In progress</option><option value="RESOLVED">Resolved</option><option value="CLOSED">Closed</option></select><small th:errors="*{feedbackStatus}"></small></label><label>Priority<select th:field="*{priority}"><option value="LOW">Low</option><option value="MEDIUM">Medium</option><option value="HIGH">High</option><option value="URGENT">Urgent</option></select><small th:errors="*{priority}"></small></label><label>Category<select th:field="*{category}"><option value="GENERAL">General</option><option value="SERVICE">Service</option><option value="ORDER">Order / payment</option><option value="PRESCRIPTION">Prescription</option><option value="INVENTORY">Inventory</option><option value="COMPLAINT">Complaint</option></select><small th:errors="*{category}"></small></label><label>Case owner<select th:field="*{assignedToUserId}"><option value="">Unassigned</option><option th:each="user : ${users}" th:value="${user.userId}" th:text="${user.fullName + ' · ' + user.role.roleName}"></option></select></label><label class="full-width">Customer response / internal resolution note<textarea th:field="*{adminResponse}" maxlength="2000" rows="7" placeholder="Explain the resolution, next action, or response to the customer."></textarea><small th:errors="*{adminResponse}"></small></label></div>
<div class="form-actions"><button class="primary-button" type="submit">Save case update</button><a th:href="@{/feedback-management/cases}">Cancel</a></div></form></section></main><script th:src="@{/js/module.js}" defer></script></body></html>
