<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Review Prescription | MediCare Pharmacy</title><link rel="stylesheet" th:href="@{/css/module.css}"></head>
<body class="module-page pharmacist"><div th:replace="~{fragments/module-header :: header}"></div><main class="edit-main"><a class="back-link" th:href="@{/pharmacist/prescriptions}">← Back to prescription queue</a><section class="edit-card"><p class="role-label">Duty Pharmacist · Clinical review</p><h1>Verify uploaded prescription</h1>
<div class="notice error" th:if="${reviewError}" th:text="${reviewError}"></div><div class="submitted-feedback"><p><strong>Prescription:</strong> <span th:text="${prescription.prescriptionNumber}">RX</span></p><p><strong>Patient:</strong> <span th:text="${prescription.customerName}">Patient</span></p><p><strong>Contact:</strong> <span th:text="${prescription.customerPhone}">Phone</span></p><p><strong>Uploaded file:</strong> <a th:if="${prescription.prescriptionFilePath != null && !#strings.isEmpty(prescription.prescriptionFilePath)}" th:href="${prescription.prescriptionFilePath}" target="_blank" rel="noopener">Open protected prescription ↗</a><span th:unless="${prescription.prescriptionFilePath != null && !#strings.isEmpty(prescription.prescriptionFilePath)}">No file available</span></p></div>
<form th:action="@{/pharmacist/prescriptions/{prescriptionId}/edit(prescriptionId=${prescription.prescriptionId})}" method="post" class="record-form" novalidate><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="form-grid"><label>Verification decision<select name="prescriptionStatus"><option value="PENDING" th:selected="${prescription.prescriptionStatus == 'PENDING'}">Keep pending</option><option value="APPROVED" th:selected="${prescription.prescriptionStatus == 'APPROVED'}">Approve for dispensing</option><option value="REJECTED" th:selected="${prescription.prescriptionStatus == 'REJECTED'}">Reject</option></select></label><label class="full-width">Pharmacist note <textarea name="pharmacistNote" maxlength="500" rows="5" placeholder="Required for rejected prescriptions; explain the decision clearly." th:text="${prescription.pharmacistNote}"></textarea></label></div><div class="form-actions"><button class="primary-button" type="submit">Save clinical decision</button><a th:href="@{/pharmacist/prescriptions}">Cancel</a></div></form></section></main><script th:src="@{/js/module.js}" defer></script></body></html>
