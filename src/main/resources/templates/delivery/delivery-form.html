<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edit Delivery | MediCare Pharmacy</title><link rel="stylesheet" th:href="@{/css/module.css}" href="/css/module.css"></head>
<body class="module-page delivery"><div th:replace="~{fragments/module-header :: header}"></div><main class="edit-main"><a class="back-link" th:href="@{/delivery/deliveries}">← Back to deliveries</a><section class="edit-card"><p class="role-label">Operations Manager · Delivery workflow</p><h1>Edit delivery</h1>
<form th:action="@{/delivery/deliveries/{deliveryId}/edit(deliveryId=${delivery.deliveryId})}" th:object="${delivery}" method="post" class="record-form" novalidate><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="form-grid"><label>Delivery number<input type="text" th:field="*{deliveryNumber}" maxlength="30" required><small th:errors="*{deliveryNumber}"></small></label><label>Customer order (optional)<select th:field="*{orderId}"><option value="">No linked order</option><option th:each="order : ${orders}" th:value="${order.orderId}" th:text="${order.orderNumber + ' — ' + order.customerName}">Order</option></select></label><label>Customer name<input type="text" th:field="*{customerName}" maxlength="120" required><small th:errors="*{customerName}"></small></label><label>Customer phone<input type="text" th:field="*{customerPhone}" maxlength="30" required><small th:errors="*{customerPhone}"></small></label><label class="full-width">Delivery address<textarea th:field="*{deliveryAddress}" maxlength="300" rows="3" required></textarea><small th:errors="*{deliveryAddress}"></small></label><label>Delivery person<input type="text" th:field="*{deliveryPersonName}" maxlength="120"><small th:errors="*{deliveryPersonName}"></small></label><label>Delivery date<input type="date" th:field="*{deliveryDate}"><small th:errors="*{deliveryDate}"></small></label><label>Status<select th:field="*{deliveryStatus}"><option value="PENDING">Pending</option><option value="ASSIGNED">Assigned</option><option value="OUT_FOR_DELIVERY">Out for delivery</option><option value="DELIVERED">Delivered</option><option value="CANCELLED">Cancelled</option></select><small th:errors="*{deliveryStatus}"></small></label></div>
<div class="form-actions"><button class="primary-button" type="submit">Save changes</button><a th:href="@{/delivery/deliveries}">Cancel</a></div></form></section></main></body></html>
