<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edit Promotion | MediCare Pharmacy</title><link rel="stylesheet" th:href="@{/css/module.css}"></head>
<body th:class="${promotionWorkspace == 'PROCUREMENT' ? 'module-page procurement' : 'module-page operations'}">
<div th:replace="~{fragments/module-header :: header}"></div>
<main class="edit-main"><a class="back-link" th:href="${promotionBasePath}">← Back to campaigns</a>
    <section class="edit-card"><p class="role-label" th:text="${promotionRoleLabel + ' · Update'}">Operations Manager · Update</p><h1>Edit promotion campaign</h1><p class="page-intro">Changes affect future qualifying checkouts only. Existing invoices keep their original discount records.</p>
        <form th:action="${promotionBasePath + '/' + promotion.promotionId + '/edit'}" th:object="${promotion}" method="post" class="record-form" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <p class="form-error" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
            <div class="form-grid">
                <label>Campaign code<input th:field="*{campaignCode}" maxlength="40" required><small th:errors="*{campaignCode}"></small></label>
                <label>Campaign name<input th:field="*{campaignName}" maxlength="150" required><small th:errors="*{campaignName}"></small></label>
                <label>Discount type<select th:field="*{discountType}"><option value="PERCENT">Percentage (%)</option><option value="FIXED">Fixed amount (LKR)</option></select><small th:errors="*{discountType}"></small></label>
                <label>Discount value<input th:field="*{discountValue}" type="number" step="0.01" min="0.01" required><small th:errors="*{discountValue}"></small></label>
                <label>Minimum order amount<input th:field="*{minimumOrderAmount}" type="number" step="0.01" min="0" required><small th:errors="*{minimumOrderAmount}"></small></label>
                <label>Branch scope<select th:field="*{branchId}"><option value="">All active branches</option><option th:each="branch : ${branches}" th:value="${branch.branchId}" th:text="${branch.branchName}"></option></select></label>
                <label>Specific medicine<select th:field="*{medicineId}"><option value="">All medicines</option><option th:each="medicine : ${medicines}" th:value="${medicine.medicineId}" th:text="${medicine.medicineName}"></option></select></label>
                <label>Category scope<input th:field="*{category}" maxlength="100" placeholder="Optional – leave blank for all"><small th:errors="*{category}"></small></label>
                <label>Start date<input th:field="*{startDate}" type="date" required><small th:errors="*{startDate}"></small></label>
                <label>End date<input th:field="*{endDate}" type="date" required><small th:errors="*{endDate}"></small></label>
                <label class="full-width">Campaign description<textarea th:field="*{description}" maxlength="500" rows="4"></textarea><small th:errors="*{description}"></small></label>
                <label class="checkbox-label"><input th:field="*{active}" type="checkbox"> Campaign active</label>
            </div>
            <div class="form-actions"><button class="primary-button" type="submit">Save campaign</button><a th:href="${promotionBasePath}">Cancel</a></div>
        </form>
    </section>
</main>
<script th:src="@{/js/module.js}" defer></script>
</body></html>
