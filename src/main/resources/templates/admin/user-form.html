<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edit User | MediCare Pharmacy</title><link rel="stylesheet" th:href="@{/css/module.css}" href="/css/module.css"></head>
<body class="module-page admin"><div th:replace="~{fragments/module-header :: header}"></div><main class="edit-main"><a class="back-link" th:href="@{/admin/users}">← Back to users</a><section class="edit-card"><p class="role-label">Admin · Update</p><h1>Edit user account</h1><p class="page-intro">Leave password empty to keep the existing password.</p>
<form th:action="@{/admin/users/{userId}/edit(userId=${userForm.userId})}" th:object="${userForm}" method="post" class="record-form" novalidate><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<p class="form-error" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p><div class="form-grid"><label>Full name<input type="text" th:field="*{fullName}" maxlength="120" required><small th:errors="*{fullName}"></small></label><label>Email<input type="email" th:field="*{email}" maxlength="150" required><small th:errors="*{email}"></small></label><label>Role<select th:field="*{roleId}" required><option value="">Choose role</option><option th:each="role : ${roles}" th:value="${role.roleId}" th:text="${role.roleName}">Role</option></select><small th:errors="*{roleId}"></small></label><label>New password<input type="password" th:field="*{password}" minlength="8" maxlength="72" placeholder="Leave empty to keep password"><small th:errors="*{password}"></small></label><label class="checkbox-label"><input type="checkbox" th:field="*{active}"> Active account</label></div><div class="form-actions"><button class="primary-button" type="submit">Save changes</button><a th:href="@{/admin/users}">Cancel</a></div></form></section></main></body></html>
