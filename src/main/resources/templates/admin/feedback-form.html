<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Review Feedback | MediCare Pharmacy</title><link rel="stylesheet" th:href="@{/css/module.css}" href="/css/module.css"></head>
<body class="module-page admin"><div th:replace="~{fragments/module-header :: header}"></div>
<main class="edit-main"><a class="back-link" th:href="@{/admin/feedback}">← Back to feedback</a><section class="edit-card"><p class="role-label">Admin · Review</p><h1>Review feedback</h1>
<div class="submitted-feedback"><p><strong>From:</strong> <span th:text="${'User ID: ' + feedback.userId}">User</span></p><p><strong>Subject:</strong> <span th:text="${feedback.subject}">Subject</span></p><p><strong>Rating:</strong> <span th:text="${feedback.rating == null ? '—' : feedback.rating + ' / 5'}">5 / 5</span></p><p><strong>Message:</strong></p><blockquote th:text="${feedback.message}">Message</blockquote></div>
<form th:action="@{/admin/feedback/{feedbackId}/edit(feedbackId=${feedback.feedbackId})}" th:object="${feedbackForm}" method="post" class="record-form" novalidate><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="form-grid"><label>Status<select th:field="*{feedbackStatus}"><option value="NEW">New</option><option value="IN_PROGRESS">In progress</option><option value="RESOLVED">Resolved</option><option value="CLOSED">Closed</option></select><small th:errors="*{feedbackStatus}"></small></label><label class="full-width">Admin response<textarea th:field="*{adminResponse}" maxlength="2000" rows="6" placeholder="Write a response for the user"></textarea><small th:errors="*{adminResponse}"></small></label></div>
<div class="form-actions"><button class="primary-button" type="submit">Save feedback update</button><a th:href="@{/admin/feedback}">Cancel</a></div></form></section></main></body></html>
