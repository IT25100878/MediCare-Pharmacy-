spring.application.name=PharmacyManagement

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=PharmacyManagementDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Keep pages responsive after the UI is finalised. Restart the app after editing a template.
spring.thymeleaf.cache=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Conservative pool settings for a local SQL Server Express instance.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000


server.port=8081

# Required only for Admin registration. Change this private value before testing.
pharmacy.admin.registration-code=Saraf123
pharmacy.demo-data.enabled=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
